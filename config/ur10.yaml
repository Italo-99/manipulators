## Configuration file used by the planner

manipulator_name: manipulator

joint_names: [shoulder_pan_joint, shoulder_lift_joint, elbow_joint, wrist_1_joint, wrist_2_joint, wrist_3_joint]

ee_name: tool0

base_name: base_link

vel_factor: 0.5

acc_factor: 0.5

sample_time: 0.002 # Time distance between two consecutive points of the trajectory computed

max_velocity: 1    # Maximum velocity of the end-effector in [m/s] (up to 1.0) 